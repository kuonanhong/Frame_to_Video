<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRAME CPU Model Check</title><style>body{font:18px system-ui;max-width:900px;margin:40px auto;padding:20px}button{padding:12px;margin:8px}pre{white-space:pre-wrap}</style><h1>CPU model check</h1><p>This test uses bundled local models in a worker, without WebGPU or a remote API. Loading large models can take a minute. It does not upload text.</p><button id="zh">中文聲音</button><button id="en">English voice</button><button id="uk">Alan UK voice</button><button id="llm">English narration</button><pre id="log"></pre><script type="module">
import * as ai from './client.mjs';window.frameAI=ai;window.modelResults={};
const log=document.querySelector('#log');
const progress=p=>{log.textContent=JSON.stringify(p);};
async function test(kind){try{let result;if(kind==='llm')result=await ai.generateNarration({prompt:'A cat sits by a sunlit window.',objects:['cat'],language:'en',maxTokens:36,onProgress:progress});else result=await ai.synthesizeSpeech({text:kind==='zh'?'聰動成長協會，歡迎一起動手動腦。':'Welcome to our photo story.',voice:kind==='zh'?'zh_CN-huayan-medium':kind==='uk'?'en_GB-alan-low':'en_US-amy-low',onProgress:progress});window.modelResults[kind]=typeof result==='string'?{text:result}:{sampleRate:result.sampleRate,samples:result.audio.length,peak:Math.max(...result.audio.subarray(0,Math.min(50000,result.audio.length)).map(Math.abs))};log.textContent=JSON.stringify(window.modelResults[kind]);if(result.audio){const ctx=new AudioContext();const b=ctx.createBuffer(1,result.audio.length,result.sampleRate);b.copyToChannel(result.audio,0);const source=ctx.createBufferSource();source.buffer=b;source.connect(ctx.destination);source.start();}}catch(e){window.modelResults[kind]={error:e.message,code:e.code};log.textContent=e.stack;}}
['zh','en','uk','llm'].forEach(k=>document.querySelector('#'+k).onclick=()=>test(k));window.runModelTest=test;
</script></html>
